databases:
  - name: payease-db
    plan: free
    databaseName: payease
    user: payease

services:
  - type: web
    name: payease-web
    plan: free
    env: python
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn payEase.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payease-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DEBUG
        value: "False"
